<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sprite Animation</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <canvas id="canvas1"></canvas>
    <div class="controlls">
        <label for="animations">Choose Animation</label>
        <select class="sel" name="animations" id="animations">
        </br>
            <option class="opt" value="idle">Idle</option>
            <option class="opt" value="jump">Jump</option>
            <option class="opt" value="fall">Fall</option>
            <option class="opt" value="run">Run</option>
            <option class="opt" value="dizzy">Dizzy</option>
            <option class="opt" value="sit">Sit</option>
            <option class="opt" value="roll">Roll</option>
            <option class="opt" value="bite">Bite</option>
            <option class="opt" value="ko">KO</option>
            <option class="opt" value="getHit">Get Hit</option>

        </select>
    </div>



    <script src="script.js"></script>
</body>
</html>
